provider_id: teams
version: 1
title: Microsoft Teams Graph device-code setup
setup_actions:
  - id: teams-device-code
    kind: oauth_device_code
    provider: microsoft
    label: Connect Microsoft Teams
    tenant_alias: organizations
    device_code_url: https://login.microsoftonline.com/organizations/oauth2/v2.0/devicecode
    token_url: https://login.microsoftonline.com/organizations/oauth2/v2.0/token
    verification_uri: https://microsoft.com/devicelogin
    client_id_config_key: client_id
    client_id_secret_key: MS_GRAPH_CLIENT_ID
    scopes:
      - offline_access
      - openid
      - profile
      - User.Read
      - Team.ReadBasic.All
      - Channel.ReadBasic.All
      - ChannelMessage.Send
      - ChannelMessage.Read.All
      - Chat.Read
    secrets_out:
      client_id: MS_GRAPH_CLIENT_ID
      refresh_token: MS_GRAPH_REFRESH_TOKEN
      access_token: MS_GRAPH_ACCESS_TOKEN
    config_out:
      tenant_id: tenant_id
      client_id: client_id
      user_id: user_id
      team_id: team_id
      channel_id: channel_id
      chat_id: chat_id
    post_login_discovery:
      - id: me
        method: GET
        url: https://graph.microsoft.com/v1.0/me
        save:
          id: user_id
          tenant_id: tenant_id
      - id: joined_teams
        method: GET
        url: https://graph.microsoft.com/v1.0/me/joinedTeams
        select:
          from: value
          label: displayName
          value: id
          save_as: team_id
      - id: channels
        method: GET
        url_template: https://graph.microsoft.com/v1.0/teams/{team_id}/channels
        requires:
          - team_id
        select:
          from: value
          label: displayName
          value: id
          save_as: channel_id
    checklist:
      - "App registration must be multi-tenant: signInAudience = AzureADMultipleOrgs"
      - Public client/device code flow must be enabled
      - Tenant may require admin consent
      - Teams message subscriptions require delegated read scopes such as ChannelMessage.Read.All
      - Device/token endpoints must use organizations, not the developer tenant ID
questions:
  - name: tenant_id
    title: Microsoft tenant ID
    kind: string
    required: true
    help: "Discovered Microsoft Entra tenant ID. Device-code setup starts with the organizations endpoint, then saves the concrete tenant ID."
    placeholder: "organizations"
    group: Authentication
    docs_url: "https://entra.microsoft.com/#view/Microsoft_AAD_IAM/ActiveDirectoryMenuBlade/~/Overview"
  - name: client_id
    title: Microsoft client ID
    kind: string
    required: true
    help: "Application client ID for the Microsoft Graph OAuth app. If supplied by hosted config/env, setup should not ask again."
    placeholder: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    group: Authentication
    docs_url: "https://entra.microsoft.com/#view/Microsoft_AAD_RegisteredApps/ApplicationsListBlade"
  - name: refresh_token
    title: Microsoft refresh token
    kind: string
    required: false
    secret: true
    help: "Graph OAuth refresh token from Login with Microsoft; required for normal runtime sends unless access_token is supplied for testing"
    group: Authentication
  - name: access_token
    title: Microsoft access token
    kind: string
    required: false
    secret: true
    help: "Optional test-only Graph access-token override"
    group: Authentication
  - name: public_base_url
    title: Public base URL
    kind: string
    required: false
    help: "Public HTTPS URL for Graph change-notification callbacks; not required for egress-only"
    placeholder: "https://xxxx.trycloudflare.com"
    group: Connection
    validate:
      regex: "^https://"
  - name: team_id
    title: Default Team ID
    kind: string
    required: false
    placeholder: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    group: Defaults
  - name: channel_id
    title: Default Channel ID
    kind: string
    required: false
    placeholder: "19:xxxxx@thread.tacv2"
    group: Defaults
  - name: chat_id
    title: Default Chat ID
    kind: string
    required: false
    placeholder: "19:xxxxx@thread.v2"
    group: Defaults
