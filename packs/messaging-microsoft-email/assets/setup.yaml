provider_id: microsoft-email
version: 1
title: Email provider setup (Microsoft Graph)
questions:
  - name: from_address
    title: From address
    kind: string
    required: true
    help: "Sender email address"
    group: Connection
  - name: graph_tenant_id
    title: Graph tenant ID
    kind: string
    required: true
    secret: true
    help: "Azure AD tenant ID (Directory ID)"
    group: Authentication
    docs_url: "https://portal.azure.com/#view/Microsoft_AAD_IAM/ActiveDirectoryMenuBlade/~/Overview"
  - name: ms_graph_client_id
    title: Graph client ID
    kind: string
    required: true
    secret: true
    help: "Azure AD app registration client/application ID"
    group: Authentication
    docs_url: "https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps"
  - name: ms_graph_refresh_token
    title: Graph refresh token
    kind: string
    required: true
    secret: true
    help: "OAuth refresh token (delegated permissions, /me/sendMail)"
    group: Authentication
  - name: ms_graph_client_secret
    title: Graph client secret
    kind: string
    required: true
    secret: true
    help: "App client secret from Azure → Certificates & secrets"
    group: Authentication
    docs_url: "https://portal.azure.com/#view/Microsoft_AAD_RegisteredApps"
  - name: public_base_url
    title: Public base URL
    kind: string
    required: false
    help: "Public URL for webhook callbacks (optional for email)"
    placeholder: "https://xxxx.trycloudflare.com"
    group: Connection
    validate:
      regex: "^https://"
