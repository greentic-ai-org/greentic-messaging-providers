provider_id: slack
version: 1
title: Slack provider setup
setup_actions:
  - id: add_to_slack
    label: Add to Slack
    kind: oauth_install_button
    provider_id: slack
    oauth_provider_id: slack
    authorize_url: "https://slack.com/oauth/v2/authorize"
    redirect_path: "/oauth/callback/slack"
    scopes:
      - chat:write
      - channels:read
      - channels:history
      - channels:join
      - im:history
      - im:write
    client_id_source: registration
    client_id_field: slack_client_id
    app_name_template: "{{ bundle_name }} Slack"
    default_app_name: "Greentic Slack"
    registration:
      component_ref: messaging-provider-slack
      op: setup_app_registration
      client_id_output: client_id
      client_secret_output: client_secret
      app_id_output: app_id
      app_name_field: slack_app_name
      config_access_token_field: slack_configuration_access_token
      config_refresh_token_field: slack_configuration_refresh_token
questions:
  - name: slack_configuration_access_token
    title: Slack Configuration Access Token
    kind: string
    required: true
    secret: true
    help: "Short-lived access token generated at api.slack.com -> Your Apps -> App Configuration Tokens"
    group: Authentication
    docs_url: "https://api.slack.com/apps"
  - name: slack_configuration_refresh_token
    title: Slack Configuration Refresh Token
    kind: string
    required: true
    secret: true
    help: "Refresh token generated alongside the Slack configuration access token. Used to rotate expired access tokens automatically."
    group: Authentication
    docs_url: "https://api.slack.com/apps"
