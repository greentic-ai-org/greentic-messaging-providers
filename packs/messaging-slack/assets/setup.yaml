provider_id: slack
version: 1
title: Slack provider setup
setup_actions:
  - id: add_to_slack
    label: Setup Slack App
    description: "Creates your Slack app and links its Event Subscriptions & Interactivity request URLs to this bundle's message endpoint. Then click the button to install it to your workspace on api.slack.com → Allow, then seed the Bot User OAuth Token (starts with xoxb-) as a secret so the bot can send messages. If the bundle's public URL changes, re-run this step to re-point the URLs."
    kind: open_url
    provider_id: slack
    url_template: "https://api.slack.com/apps/{slack_app_id}/install-on-team?"
    app_name_template: "{{ bundle_name }} Slack"
    default_app_name: "Greentic Slack"
    registration:
      component_ref: messaging-provider-slack
      op: setup_app_registration
      signing_secret_output: slack_signing_secret
      app_id_output: slack_app_id
      app_name_field: slack_app_name
      config_access_token_field: slack_configuration_access_token
      config_refresh_token_field: slack_configuration_refresh_token
questions:
  - name: slack_configuration_access_token
    title: Slack Configuration Access Token
    kind: string
    required: true
    secret: true
    help: "Open api.slack.com/apps, find the 'Your App Configuration Tokens' panel at the top, click Generate Token, then copy the Access Token (starts with xoxe.xoxp-). Short-lived (~12h) — the refresh token below renews it."
    placeholder: "xoxe.xoxp-..."
    group: Authentication
    docs_url: "https://api.slack.com/authentication/config-tokens"
    create_url: "https://api.slack.com/apps"
  - name: slack_configuration_refresh_token
    title: Slack Configuration Refresh Token
    kind: string
    required: true
    secret: true
    help: "From the same 'Generate Token' step on api.slack.com/apps, copy the Refresh Token (starts with xoxe-1-). It rotates the access token automatically when it expires."
    placeholder: "xoxe-1-..."
    group: Authentication
    docs_url: "https://api.slack.com/authentication/config-tokens"
    create_url: "https://api.slack.com/apps"
  - name: slack_bot_token
    title: Slack Bot User OAuth Token
    kind: string
    required: true
    secret: true
    help: "Bot User OAuth Token (starts with xoxb-) from your Slack app's OAuth & Permissions page. If you used the 'Setup Slack App' button above, install the app first, then paste the token it shows here."
    placeholder: "xoxb-..."
    group: Authentication
    docs_url: "https://api.slack.com/authentication/token-types#bot"
    create_url: "https://api.slack.com/apps"
