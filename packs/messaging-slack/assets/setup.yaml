provider_id: slack
version: 1
title: Slack provider setup
questions:
  - name: public_base_url
    title: Public base URL
    kind: string
    required: true
    help: "Public-facing URL for webhook callbacks (auto-replaced by gtc start when using tunnel)"
    placeholder: "https://xxxx.trycloudflare.com"
    group: Connection
    validate:
      regex: "^https://"
  - name: api_base_url
    title: API base URL
    kind: string
    required: true
    help: "Slack API base URL (default: https://slack.com/api)"
    placeholder: "https://slack.com/api"
    group: Connection
    validate:
      regex: "^https?://"
  - name: slack_bot_token
    title: Slack bot token
    kind: string
    required: true
    secret: true
    placeholder: "xoxb-your-token-here"
    group: Authentication
    docs_url: "https://api.slack.com/apps"
  - name: default_channel
    title: Default channel
    kind: string
    required: false
    placeholder: "#general"
    group: Defaults
  - name: slack_app_id
    title: Slack App ID
    kind: string
    required: true
    help: "Find in Slack App settings → Basic Information → App ID"
    placeholder: "A0XXXXXXXXX"
    group: Authentication
    docs_url: "https://api.slack.com/apps"
  - name: slack_configuration_access_token
    title: Slack Configuration Access Token
    kind: string
    required: true
    secret: true
    help: "Short-lived access token generated at api.slack.com → Your Apps → App Configuration Tokens"
    group: Authentication
    docs_url: "https://api.slack.com/apps"
  - name: slack_configuration_refresh_token
    title: Slack Configuration Refresh Token
    kind: string
    required: true
    secret: true
    help: "Refresh token generated alongside the Slack configuration access token. Used to rotate expired access tokens automatically."
    group: Authentication
    docs_url: "https://api.slack.com/apps"
