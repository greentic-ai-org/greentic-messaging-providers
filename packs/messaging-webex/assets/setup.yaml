provider_id: webex
version: 1
title: Webex provider setup
setup_actions:
  - id: add-to-webex
    label: Add to WebEx
    kind: deep_link
    url_template: "https://web.webex.com/teams/messages/new?email={bot_email}"
    style: primary
    opens_new_window: true
    copyable: true
    requires:
      - bot_email
questions:
  - name: bot_email
    title: Webex bot email
    kind: string
    required: true
    help: "Email address assigned to your Webex bot. This is used for the final Add to WebEx link."
    group: Connection
  - name: webex_bot_token
    title: Webex bot token
    kind: string
    required: true
    secret: true
    help: "Access token from your Webex bot. You can generate one by creating a bot at https://developer.webex.com/my-apps."
    group: Authentication
    docs_url: "https://developer.webex.com/my-apps"
