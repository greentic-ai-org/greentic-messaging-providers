provider_id: webex
version: 1
title: Webex provider setup
questions:
  - name: public_base_url
    title: Public base URL
    kind: string
    required: true
    help: "Public-facing URL for webhook callbacks"
    placeholder: "https://xxxx.trycloudflare.com"
    group: Connection
    validate:
      regex: "^https://"
  - name: default_room_id
    title: Room ID
    kind: string
    required: true
    help: "Webex room ID that the bot can read and post to."
    placeholder: "Y2lzY29zcGFyazovL3VzL1JPT00v..."
    group: Destination
  - name: default_to_person_email
    title: Person email
    kind: string
    required: false
    placeholder: "user@example.com"
    group: Destination
  - name: api_base_url
    title: API base URL
    kind: string
    required: true
    help: "Webex API base URL (default: https://webexapis.com/v1)"
    placeholder: "https://webexapis.com/v1"
    group: Connection
    validate:
      regex: "^https?://"
  - name: webex_bot_token
    title: Webex bot token
    kind: string
    required: true
    secret: true
    help: "Access token from your Webex bot. You can generate one by creating a bot at https://developer.webex.com/my-apps."
    group: Authentication
    docs_url: "https://developer.webex.com/my-apps"
  - name: webhook_secret
    title: Webex webhook secret
    kind: string
    required: true
    secret: true
    help: "Shared secret Webex uses to sign webhook requests with X-Spark-Signature"
    group: Authentication
    docs_url: "https://developer.webex.com/messaging/docs/api/guides/webhooks"
