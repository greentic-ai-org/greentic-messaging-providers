provider_id: webex
version: 1
title: Webex provider setup
setup_actions:
  - id: add-to-webex
    label: Add to WebEx
    kind: deep_link
    url_template: "https://web.webex.com/teams/messages/new?email={bot_email}"
    style: primary
    opens_new_window: true
    copyable: true
    requires:
      - bot_email
questions:
  - name: bot_email
    title: Webex bot email
    kind: string
    required: true
    help: "Email address assigned to your Webex bot. Shown on the bot's page after you create it."
    group: Connection
    create_url: "https://developer.webex.com/my-apps/new/bot"
  - name: webex_bot_token
    title: Webex bot token
    kind: string
    required: true
    secret: true
    help: "Bot access token, shown once when you create the bot. If you lost it, open the bot and regenerate."
    group: Authentication
    docs_url: "https://developer.webex.com/docs/bots"
    create_url: "https://developer.webex.com/my-apps/new/bot"
