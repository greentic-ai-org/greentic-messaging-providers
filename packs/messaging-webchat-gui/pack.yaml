pack_id: messaging-webchat-gui
version: 0.4.41
kind: application
publisher: Greentic
components:
- id: ai.greentic.component-provision
  version: 0.4.41
  world: root:component/root
  supports:
  - messaging
  profiles:
    default: default
    supported:
    - default
  capabilities:
    wasi:
      random: false
      clocks: false
    host: {}
  wasm: components/provision/provision.wasm
- id: ai.greentic.component-qa
  version: 0.4.41
  world: root:component/root
  supports:
  - messaging
  profiles:
    default: default
    supported:
    - default
  capabilities:
    wasi:
      random: false
      clocks: false
    host: {}
  wasm: components/qa/qa.wasm
- id: ai.greentic.component-templates
  version: 0.4.41
  world: root:component/root
  supports:
  - messaging
  profiles:
    default: default
    supported:
    - default
  capabilities:
    wasi:
      random: false
      clocks: false
    host: {}
  wasm: components/templates/templates.wasm
- id: messaging-provider-webchat-gui
  version: 0.4.41
  world: root:component/root
  supports:
  - messaging
  profiles:
    default: default
    supported:
    - default
  capabilities:
    wasi:
      random: false
      clocks: false
    host: {}
  wasm: components/messaging-provider-webchat-gui/component.wasm
- id: messaging-provider-webchat-gui
  version: 0.1.0
  world: root:component/root
  supports:
  - messaging
  profiles:
    default: default
    supported:
    - default
  capabilities:
    wasi:
      random: false
      clocks: false
    host: {}
  wasm: components/messaging-provider-webchat-gui.wasm
dependencies: []
flows: []
assets:
- path: schemas/messaging/webchat-gui/public.config.schema.json
- path: assets/webchat-gui/index.html
- path: assets/webchat-gui/404.html
- path: assets/webchat-gui/runtime-bootstrap.js
- path: assets/webchat-gui/config/product.json
extensions:
  greentic.ext.capabilities.v1:
    kind: greentic.ext.capabilities.v1
    version: 0.4.41
    inline:
      offers:
      - cap_id: greentic.cap.messaging.provider.v1
        offer_id: messaging-webchat-gui-v1
        priority: 100
        provider:
          component_ref: messaging-provider-webchat-gui
          op: messaging.configure
        requires_setup: true
        setup:
          qa_ref: components/messaging-provider-webchat-gui
        version: 0.4.41
      schema_version: 1
  greentic.messaging.validators.v1:
    kind: greentic.messaging.validators.v1
    version: 0.4.41
    inline:
      validators:
      - component_ref: oci://ghcr.io/greenticai/validators/messaging:0.4.19
        id: greentic.validators.messaging
        world: greentic:pack-validate/pack-validator@0.1.0
  greentic.provider-extension.v1:
    kind: greentic.provider-extension.v1
    version: 0.4.41
    inline:
      providers:
      - provider_type: messaging.webchat-gui
        capabilities:
        - messaging
        ops:
        - send
        - ingest
        - ingest_http
        - qa-spec
        - apply-answers
        - i18n-keys
        config_schema_ref: schemas/messaging/webchat-gui/public.config.schema.json
        runtime:
          component_ref: messaging-provider-webchat-gui
          export: schema-core-api
          world: greentic:provider/schema-core@1.0.0
  greentic.static-routes.v1:
    kind: greentic.static-routes.v1
    version: 0.4.41
    inline:
      routes:
      - id: webchat-gui
        index_file: index.html
        public_path: /v1/web/webchat/{tenant}
        scope:
          team: false
          tenant: true
        source_root: assets/webchat-gui
        spa_fallback: index.html
      version: 1
  messaging.provider_ingress.v1:
    kind: messaging.provider_ingress.v1
    version: 0.4.41
    inline:
      capabilities:
        content_types:
        - application/json
        supports_webhook_validation: false
      component_ref: messaging-provider-webchat-gui
      export: ingest-http
      world: greentic:provider/schema-core@1.0.0
  messaging.provider_routes.v1:
    kind: messaging.provider_routes.v1
    version: 0.4.41
    inline:
      backend_base_path: /v1/messaging/webchat/{tenant}
      provider_type: messaging.webchat-gui
      routes:
      - id: directline-token
        kind: backend
        path: /v1/messaging/webchat/{tenant}/token
      - id: directline-api
        kind: backend
        path: /v1/messaging/webchat/{tenant}/v3/directline/{*path}
