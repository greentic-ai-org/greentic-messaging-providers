provider_id: webchat-gui
version: 1
title: Webchat GUI provider setup
questions:
  - name: public_base_url
    title: Public base URL
    kind: string
    required: true
    default: "http://localhost:8080"
    help: "Example: https://xxxx.trycloudflare.com (auto-replaced by gtc start when using tunnel)"
    validate:
      regex: "^https?://"
  - name: mode
    title: Mode
    kind: string
    required: true
    default: "local_queue"
    help: "WebChat mode: local_queue | websocket | pubsub"
  - name: route
    title: Route
    kind: string
    required: false
    default: "webchat"
  - name: tenant_channel_id
    title: Tenant channel ID
    kind: string
    required: false
  - name: jwt_signing_key
    title: JWT signing key
    kind: string
    required: true
    secret: true
    help: "Secret key used to sign Direct Line tokens. Use any random string (e.g. openssl rand -hex 32)."
  - name: base_url
    title: Base URL
    kind: string
    required: false
    help: "Optional DirectLine or WebChat server base URL"
    validate:
      regex: "^https?://"

  # ── OAuth Login ──────────────────────────────────────────
  - name: oauth_enabled
    title: Enable OAuth login
    kind: boolean
    required: false
    default: "false"
    help: "Require users to sign in before accessing the chat"

  # ── Google ───────────────────────────────────────────────
  - name: oauth_enable_google
    title: Enable Google login
    kind: boolean
    required: false
    default: "false"
    help: "Allow users to sign in with their Google account"
    visible_if:
      field: oauth_enabled
      eq: "true"
  - name: oauth_google_client_id
    title: Google Client ID
    kind: string
    required: false
    help: |
      Setup instructions:
      1. Go to https://console.cloud.google.com/apis/credentials
      2. Create OAuth 2.0 Client ID (Web application)
      3. Add your WebChat URL as Authorized redirect URI
      4. Copy the Client ID here
    visible_if:
      field: oauth_enable_google
      eq: "true"
  - name: oauth_google_client_secret
    title: Google Client Secret
    kind: string
    required: false
    secret: true
    help: "Copy the Client Secret from Google Cloud Console"
    visible_if:
      field: oauth_enable_google
      eq: "true"

  # ── Microsoft ────────────────────────────────────────────
  - name: oauth_enable_microsoft
    title: Enable Microsoft login
    kind: boolean
    required: false
    default: "false"
    help: "Allow users to sign in with their Microsoft account"
    visible_if:
      field: oauth_enabled
      eq: "true"
  - name: oauth_microsoft_client_id
    title: Microsoft Client ID
    kind: string
    required: false
    help: |
      Setup instructions:
      1. Go to https://portal.azure.com → App registrations
      2. Create new registration (Web / Single-page application)
      3. Add your WebChat URL as Redirect URI
      4. Copy the Application (client) ID here
    visible_if:
      field: oauth_enable_microsoft
      eq: "true"
  - name: oauth_microsoft_client_secret
    title: Microsoft Client Secret
    kind: string
    required: false
    secret: true
    help: "Copy the Client Secret from Azure App Registration → Certificates & secrets"
    visible_if:
      field: oauth_enable_microsoft
      eq: "true"

  # ── GitHub ───────────────────────────────────────────────
  - name: oauth_enable_github
    title: Enable GitHub login
    kind: boolean
    required: false
    default: "false"
    help: "Allow users to sign in with their GitHub account"
    visible_if:
      field: oauth_enabled
      eq: "true"
  - name: oauth_github_client_id
    title: GitHub Client ID
    kind: string
    required: false
    help: |
      Setup instructions:
      1. Go to https://github.com/settings/developers
      2. Create a new OAuth App
      3. Set Homepage URL and Callback URL to your WebChat URL
      4. Copy the Client ID here
    visible_if:
      field: oauth_enable_github
      eq: "true"
  - name: oauth_github_client_secret
    title: GitHub Client Secret
    kind: string
    required: false
    secret: true
    help: "Copy the Client Secret from GitHub OAuth App settings"
    visible_if:
      field: oauth_enable_github
      eq: "true"

  # ── Custom OIDC ──────────────────────────────────────────
  - name: oauth_enable_custom
    title: Enable custom OIDC provider
    kind: boolean
    required: false
    default: "false"
    help: "Add a custom OpenID Connect provider (Okta, Auth0, Keycloak, etc.)"
    visible_if:
      field: oauth_enabled
      eq: "true"
  - name: oauth_custom_label
    title: Provider display name
    kind: string
    required: false
    help: "Name shown on the login button (e.g. 'Company SSO')"
    visible_if:
      field: oauth_enable_custom
      eq: "true"
  - name: oauth_custom_auth_url
    title: Authorization URL
    kind: string
    required: false
    help: "OIDC authorization endpoint (e.g. https://your-idp.com/authorize)"
    visible_if:
      field: oauth_enable_custom
      eq: "true"
    validate:
      regex: "^https://"
  - name: oauth_custom_token_url
    title: Token URL
    kind: string
    required: false
    help: "OIDC token endpoint (e.g. https://your-idp.com/oauth/token)"
    visible_if:
      field: oauth_enable_custom
      eq: "true"
    validate:
      regex: "^https://"
  - name: oauth_custom_client_id
    title: Client ID
    kind: string
    required: false
    help: "OAuth client ID from your identity provider"
    visible_if:
      field: oauth_enable_custom
      eq: "true"
  - name: oauth_custom_scopes
    title: Scopes
    kind: string
    required: false
    default: "openid profile email"
    help: "Space-separated scopes (default: openid profile email)"
    visible_if:
      field: oauth_enable_custom
      eq: "true"
