provider_id: email
version: 1
title: Email provider setup (SMTP)
questions:
  - name: host
    title: SMTP host
    kind: string
    required: true
    help: "SMTP server host name"
    group: Connection
  - name: port
    title: SMTP port
    kind: number
    required: true
    default: 587
    help: "SMTP server port"
    placeholder: "587"
    group: Connection
  - name: username
    title: SMTP username
    kind: string
    required: true
    help: "SMTP account username"
    group: Authentication
  - name: password
    title: SMTP password
    kind: string
    required: true
    secret: true
    help: "SMTP account password"
    group: Authentication
  - name: from_address
    title: From address
    kind: string
    required: true
    help: "Sender email address"
    group: Connection
  - name: tls_mode
    title: TLS mode
    kind: enum
    choices:
      - starttls
      - implicit
      - none
    required: true
    default: "starttls"
    help: "SMTP TLS mode"
    group: Connection
  - name: public_base_url
    title: Public base URL
    kind: string
    required: false
    help: "Public URL for webhook callbacks (optional for email)"
    placeholder: "https://xxxx.trycloudflare.com"
    group: Connection
    validate:
      regex: "^https://"
