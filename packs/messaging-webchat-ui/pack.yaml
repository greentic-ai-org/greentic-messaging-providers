pack_id: messaging-webchat-ui
version: 0.5.10
kind: application
publisher: Greentic
display_name: WebChat UI
capabilities: []
components: []
dependencies: []
flows: []
assets:
- path: secret-requirements.json
extensions:
  greentic.static-routes.v1:
    kind: greentic.static-routes.v1
    version: 0.5.10
    inline:
      routes:
      - id: webchat-gui
        index_file: index.html
        public_path: /v1/web/webchat/{tenant}
        scope:
          team: false
          tenant: true
        source_root: assets/webchat-gui
        spa_fallback: index.html
      version: 1
