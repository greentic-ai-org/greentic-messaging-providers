[workspace]
members = ["components/*", "crates/*"]
default-members = [
    "crates/messaging-core",
    "crates/provider-common",
    "crates/provider-runtime-config",
    "crates/provider-tests",
    "crates/greentic-messaging-tester",
]
exclude = [
    "components/ai.greentic.component-templates",
    "components/provision",
    "components/qa",
    "components/questions",
    "components/templates",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.4.100"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
assert_cmd = "2"
axum = "0.8"
base64 = "0.22"
chrono = "0.4"
ciborium = "0.2"
clap = "4"
glob = "0.3"
greentic-interfaces = "0.5"
greentic-interfaces-guest = { version = "0.5", default-features = false }
greentic-interfaces-wasmtime = "0.5"
greentic-messaging-planned = { path = "crates/greentic-messaging-planned" }
greentic-messaging-renderer = { path = "crates/greentic-messaging-renderer" }
greentic-runner-desktop = "0.5"
greentic-telemetry = { version = "0.5", default-features = false }
greentic-types = "0.5"
hmac = "0.13"
htmlescape = "0.3"
http = "1"
insta = { version = "1", features = ["json"] }
jsonschema = { version = "0.46", default-features = false }
once_cell = "1"
predicates = "3"
provider-common = { package = "greentic-messaging-provider-common", version = "0.4.102", path = "crates/provider-common" }
regex = "1"
rpassword = "7.5"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_gtc", version = "2.5.2" }
serde_yaml_bw = { package = "serde_yaml_gtc", version = "2.5.2" }
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
ureq = "3"
urlencoding = "2"
uuid = { version = "1", features = ["v4"] }
wasmtime = { version = "43.0.2", features = ["component-model", "cache"] }
wasmtime-wasi = "43.0.2"
webchat-directline-core = { path = "crates/webchat-directline-core" }
wit-bindgen = "0.57"
zip = "8"

# Local override: pick up unreleased greentic-telemetry 0.5.2
# (`set_component_name`, `set_caller_location_enabled`, span-end emission).
# Drop once 0.5.2 ships to crates.io.
[patch.crates-io]
greentic-telemetry = { path = "../greentic-telemetry" }
