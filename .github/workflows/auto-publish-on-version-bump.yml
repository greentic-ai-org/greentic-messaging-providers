name: Auto Publish On Version Bump

# Publishes a provider to GHCR whenever its `providers.<name>.version` value in
# ci/provider-matrix.json changes on develop. This exists because the account
# that owns releases cannot use workflow_dispatch (GitHub returns
# "Actions has been disabled for this user" for that account), while ordinary
# push-triggered workflows run fine. There is deliberately no approval gate
# here: every version-bumping merge to develop is a public release.

on:
  push:
    branches: [develop]

concurrency:
  group: auto-publish-on-version-bump-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.diff.outputs.providers }}
      has_changes: ${{ steps.diff.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect provider version bumps
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          ZERO_SHA = "0" * 40
          before_sha = os.environ["BEFORE_SHA"]
          after_sha = os.environ["AFTER_SHA"]

          def commit_exists(sha: str) -> bool:
              return subprocess.run(
                  ["git", "cat-file", "-e", f"{sha}^{{commit}}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              ).returncode == 0

          def read_matrix_at(ref: str):
              try:
                  raw = subprocess.check_output(
                      ["git", "show", f"{ref}:ci/provider-matrix.json"],
                      stderr=subprocess.DEVNULL,
                      text=True,
                  )
              except subprocess.CalledProcessError:
                  return None
              return json.loads(raw)

          providers_to_publish: list[str] = []
          reason = ""

          if before_sha == ZERO_SHA:
              reason = "before SHA is all-zero (branch creation); treating as nothing to publish"
          elif not commit_exists(before_sha):
              reason = f"before SHA {before_sha} is unreachable (force push?); treating as nothing to publish"
          else:
              after_matrix = read_matrix_at(after_sha)
              if after_matrix is None:
                  raise SystemExit(
                      f"ci/provider-matrix.json is missing or invalid JSON at {after_sha}; refusing to guess"
                  )
              before_matrix = read_matrix_at(before_sha) or {"providers": {}}

              before_providers = before_matrix.get("providers", {})
              after_providers = after_matrix.get("providers", {})

              for name, meta in after_providers.items():
                  new_version = meta.get("version")
                  old_version = (before_providers.get(name) or {}).get("version")
                  if new_version and new_version != old_version:
                      providers_to_publish.append(name)

              providers_to_publish.sort()
              reason = (
                  f"version change detected for: {', '.join(providers_to_publish)}"
                  if providers_to_publish
                  else "no provider version changes between before and after"
              )

          has_changes = bool(providers_to_publish)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"providers={json.dumps(providers_to_publish)}\n")
              handle.write(f"has_changes={'true' if has_changes else 'false'}\n")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("## Auto Publish Detection\n")
              handle.write(f"- before: `{before_sha}`\n")
              handle.write(f"- after: `{after_sha}`\n")
              handle.write(f"- reason: {reason}\n")
              if providers_to_publish:
                  handle.write(f"- providers to publish: {', '.join(providers_to_publish)}\n")
          PY

  guard-not-already-published:
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.has_changes == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install oras
        uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Fail if any detected version is already published
        env:
          PROVIDERS_JSON: ${{ needs.detect.outputs.providers }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          already_published=()
          unverifiable=()

          for provider in $(echo "${PROVIDERS_JSON}" | jq -r '.[]'); do
            detail="$(python3 ci/provider_matrix.py resolve-provider "${provider}")"
            pack="$(echo "${detail}" | jq -r '.pack')"
            version="$(echo "${detail}" | jq -r '.version')"
            # Same GHCR path shape as resolve-provider's pack_ghcr_target in
            # provider-build-publish.yml: ghcr.io/<owner>/packs/messaging/<pack>.
            ref="ghcr.io/${OWNER}/packs/messaging/${pack}:${version}"

            echo "Checking whether ${ref} already exists on GHCR..."
            set +e
            output="$(oras manifest fetch --descriptor "${ref}" 2>&1)"
            status=$?
            set -e

            if [ "${status}" -eq 0 ]; then
              echo "::error::${provider} version ${version} is already published at ${ref}"
              already_published+=("${provider}@${version} (${ref})")
            elif echo "${output}" | grep -qiE '404|not found|manifest unknown'; then
              echo "OK: ${ref} does not exist yet on GHCR; safe to publish."
            else
              echo "::error::Could not verify GHCR status for ${ref}: ${output}"
              unverifiable+=("${provider}@${version} (${ref}): ${output}")
            fi
          done

          if [ "${#already_published[@]}" -gt 0 ] || [ "${#unverifiable[@]}" -gt 0 ]; then
            echo "Auto-publish guard failed."
            for entry in "${already_published[@]:-}"; do
              [ -n "${entry}" ] && echo "  already published: ${entry}"
            done
            for entry in "${unverifiable[@]:-}"; do
              [ -n "${entry}" ] && echo "  could not verify: ${entry}"
            done
            exit 1
          fi

  publish:
    needs: [detect, guard-not-already-published]
    if: ${{ needs.detect.outputs.has_changes == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(needs.detect.outputs.providers) }}
    permissions:
      contents: read
      packages: write
      actions: write
    uses: ./.github/workflows/provider-build-publish.yml
    with:
      provider: ${{ matrix.provider }}
      publish: true
      publish_latest: true
