name: Publish Shared Provider Crate

on:
  push:
    branches: ["main"]
    paths:
      - "crates/provider-common/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/publish-shared-crate.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to crates.io after validation succeeds
        required: false
        default: false
        type: boolean
      expected_version:
        description: Optional version guard; fail if provider-common does not match
        required: false
        type: string
  workflow_call:
    inputs:
      publish:
        description: Publish to crates.io after validation succeeds
        required: false
        default: false
        type: boolean
      expected_version:
        description: Optional version guard; fail if provider-common does not match
        required: false
        type: string
    outputs:
      crate_name:
        description: Published crate package name
        value: ${{ jobs.shared-crate.outputs.crate_name }}
      version:
        description: Shared crate package version
        value: ${{ jobs.shared-crate.outputs.version }}
      publish_status:
        description: published, already-published, or dry-run
        value: ${{ jobs.shared-crate.outputs.publish_status }}

concurrency:
  group: publish-shared-crate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shared-crate:
    runs-on: ubuntu-latest
    outputs:
      crate_name: ${{ steps.metadata.outputs.crate_name }}
      version: ${{ steps.metadata.outputs.version }}
      publish_status: ${{ steps.status.outputs.publish_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-shared-provider-crate

      - name: Resolve crate metadata
        id: metadata
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          manifest = Path("crates/provider-common/Cargo.toml")
          data = tomllib.loads(manifest.read_text())
          package = data["package"]
          crate_name = package["name"]
          version = package["version"]
          expected = os.environ.get("EXPECTED_VERSION", "").strip()
          if expected and expected != version:
            raise SystemExit(
              f"expected provider-common version {expected}, found {version}"
            )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"crate_name={crate_name}\n")
            handle.write(f"version={version}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
            handle.write("## Shared Provider Crate\n")
            handle.write(f"- crate: `{crate_name}`\n")
            handle.write(f"- version: `{version}`\n")
            handle.write(f"- sha: `{os.environ['GITHUB_SHA']}`\n")
          PY

      - name: cargo fmt
        run: cargo fmt --check -p greentic-messaging-provider-common

      - name: cargo clippy
        run: cargo clippy -p greentic-messaging-provider-common --all-targets -- -D warnings

      - name: cargo test
        run: cargo test -p greentic-messaging-provider-common

      - name: cargo publish dry-run
        run: cargo publish --dry-run -p greentic-messaging-provider-common

      - name: Check crates.io version
        id: crates_io
        env:
          CRATE_NAME: ${{ steps.metadata.outputs.crate_name }}
          CRATE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          crate_name = os.environ["CRATE_NAME"]
          version = os.environ["CRATE_VERSION"]
          url = f"https://crates.io/api/v1/crates/{crate_name}/{version}"
          request = urllib.request.Request(url, headers={"User-Agent": "greentic-shared-crate-release"})

          exists = False
          try:
            with urllib.request.urlopen(request, timeout=20) as response:
              exists = response.status == 200
              if exists:
                json.load(response)
          except urllib.error.HTTPError as err:
            if err.code != 404:
              raise

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
            handle.write(f"exists={'true' if exists else 'false'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
            handle.write(f"- crates.io already has version: `{str(exists).lower()}`\n")
          PY

      - name: Publish to crates.io
        id: publish
        if: >-
          ${{ steps.crates_io.outputs.exists != 'true' &&
              ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
               (github.event_name == 'workflow_dispatch' && inputs.publish) ||
               (github.event_name == 'workflow_call' && inputs.publish)) }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p greentic-messaging-provider-common

      - name: Resolve publish status
        id: status
        env:
          VERSION_EXISTS: ${{ steps.crates_io.outputs.exists }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          if [ "${VERSION_EXISTS}" = "true" ]; then
            status="already-published"
          elif [ "${PUBLISH_OUTCOME}" = "success" ]; then
            status="published"
          else
            status="dry-run"
          fi
          echo "publish_status=${status}" >> "${GITHUB_OUTPUT}"
          echo "- publish status: \`${status}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Write release metadata
        env:
          CRATE_NAME: ${{ steps.metadata.outputs.crate_name }}
          CRATE_VERSION: ${{ steps.metadata.outputs.version }}
          PUBLISH_STATUS: ${{ steps.status.outputs.publish_status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
            "crate_name": os.environ["CRATE_NAME"],
            "version": os.environ["CRATE_VERSION"],
            "git_sha": os.environ["GITHUB_SHA"],
            "publish_status": os.environ["PUBLISH_STATUS"],
          }
          Path("shared-crate-release.json").write_text(
            json.dumps(metadata, indent=2, sort_keys=True) + "\n",
            encoding="utf-8",
          )
          PY

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: shared-crate-release-metadata
          path: shared-crate-release.json
