name: CodeQL
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  contents: read
  actions: read
jobs:
  codeql:
    uses: greenticai/.github/.github/workflows/codeql.yml@main
    with:
      toolchain-variant: wasm
